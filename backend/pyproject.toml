[tool.poetry]
name = "guardnous"
version = "2.0.0"
description = "IaC Security Consolidation Platform"
authors = ["GuardNous Team"]
package-mode = false

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.109.2"
uvicorn = {version = "^0.27.1", extras = ["standard"]}
pydantic = "^2.6.1"
pydantic-settings = "^2.1.0"
sqlalchemy = "^2.0.25"
asyncpg = "^0.29.0"
psycopg2-binary = "^2.9.9"
alembic = "^1.13.1"
python-hcl2 = "^4.3.2"
pyyaml = "^6.0.1"
requests = "^2.31.0"
celery = {version = "^5.3.6", extras = ["redis"]}
redis = "^5.0.1"
python-jose = {version = "^3.3.0", extras = ["cryptography"]}
PyJWT = {version = "^2.8.0", extras = ["crypto"]}
passlib = {version = "^1.7.4", extras = ["bcrypt"]}
bcrypt = "4.0.1"
python-multipart = "^0.0.6"
httpx = "^0.26.0"
jinja2 = "^3.1.3"
xhtml2pdf = "^0.2.16"
croniter = "^2.0.0"
pyotp = "^2.9.0"
qrcode = {version = "^7.4.2", extras = ["pil"]}
reportlab = "^4.1.0"
# Cloud SDKs (boto3, azure-*, google-*) are pinned in requirements-cloud.txt and
# installed by the Dockerfile. Without them the connectors report an error;
# they never return simulated data unless DEMO_DATA_ENABLED=true.

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.23.4"
pytest-cov = "^4.1.0"
pytest-httpx = "^0.28.0"
aiosqlite = "^0.20.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 140

[tool.ruff.lint]
# Real defects only: syntax and undefined names, unused code, redefinitions.
select = ["E", "F", "W"]
ignore = [
    "E501",   # line length is not enforced
    "E712",   # SQLAlchemy filters need `== True` / `== False`
    "E402",   # some modules set up paths or settings before importing
    "E741",   # short names in comprehensions
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]          # re-exports
"alembic/versions/*" = ["F401"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
