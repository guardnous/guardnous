{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "guardnous.fullname" . }}-secrets
  labels:
    {{- include "guardnous.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.secrets.secretKey | quote }}
  ENCRYPTION_KEY: {{ .Values.secrets.encryptionKey | quote }}
  {{- if include "guardnous.bundledDatabase" . }}
  DATABASE_PASSWORD: {{ .Values.secrets.databasePassword | default "guardnous" | quote }}
  {{- end }}
  {{- with .Values.secrets.initialAdminPassword }}
  INITIAL_ADMIN_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubAppPrivateKey }}
  GITHUB_APP_PRIVATE_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubAppWebhookSecret }}
  GITHUB_APP_WEBHOOK_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.llmApiKey }}
  LLM_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubClientId }}
  GITHUB_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubClientSecret }}
  GITHUB_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.gitlabClientId }}
  GITLAB_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.gitlabClientSecret }}
  GITLAB_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.bitbucketClientId }}
  BITBUCKET_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.bitbucketClientSecret }}
  BITBUCKET_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.azureDevopsClientId }}
  AZURE_DEVOPS_CLIENT_ID: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.azureDevopsClientSecret }}
  AZURE_DEVOPS_CLIENT_SECRET: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.nvdApiKey }}
  NVD_API_KEY: {{ . | quote }}
  {{- end }}
  {{- range $name, $value := .Values.secrets.extra }}
  {{ $name }}: {{ $value | toString | quote }}
  {{- end }}
{{- end }}
{{- if or .Values.database.externalUrl .Values.redis.externalUrl }}
---
# Connection URLs derived from database.externalUrl / redis.externalUrl.
# Created also when secrets.existingSecret is used.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "guardnous.connectionSecretName" . }}
  labels:
    {{- include "guardnous.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.database.externalUrl }}
  DATABASE_URL: {{ include "guardnous.databaseUrl" . | quote }}
  DATABASE_URL_SYNC: {{ include "guardnous.databaseUrlSync" . | quote }}
  {{- end }}
  {{- if .Values.redis.externalUrl }}
  REDIS_URL: {{ include "guardnous.redisUrl" . | quote }}
  CELERY_BROKER_URL: {{ include "guardnous.celeryBrokerUrl" . | quote }}
  CELERY_RESULT_BACKEND: {{ include "guardnous.celeryResultBackend" . | quote }}
  {{- end }}
{{- end }}
