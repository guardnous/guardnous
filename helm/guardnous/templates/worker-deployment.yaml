apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "guardnous.fullname" . }}-worker
  labels:
    {{- include "guardnous.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  {{- if not .Values.worker.hpa.enabled }}
  replicas: {{ .Values.worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "guardnous.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: worker
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "guardnous.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: worker
    spec:
      {{- include "guardnous.podSpec" . | nindent 6 }}
      {{- include "guardnous.pluginCacheVolume" . | nindent 6 }}
      containers:
        - name: worker
          image: {{ include "guardnous.image" (dict "image" .Values.worker.image "global" .Values.global) }}
          imagePullPolicy: {{ .Values.worker.image.pullPolicy }}
          command: ["celery"]
          args:
            - "-A"
            - "app.tasks.celery_app"
            - "worker"
            - "--loglevel=info"
            - "--concurrency={{ .Values.worker.concurrency }}"
          {{- include "guardnous.backendEnvFrom" . | nindent 10 }}
          {{- include "guardnous.backendEnv" . | nindent 10 }}
          {{- include "guardnous.pluginCacheMount" . | nindent 10 }}
          livenessProbe:
            exec:
              # Ping this pod's own worker (its node name is celery@<pod name>)
              command: ["sh", "-c", "celery -A app.tasks.celery_app inspect ping --timeout 5 -d celery@$(hostname)"]
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          {{- include "guardnous.backendSecurityContext" . | nindent 10 }}
