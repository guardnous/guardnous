{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "guardnous.fullname" . }}
  labels:
    {{- include "guardnous.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "guardnous.fullname" . }}-api
                port:
                  number: {{ .Values.api.port }}
          {{- /* /.well-known serves the OIDC documents cloud providers fetch;
                 /docs, /redoc and /openapi.json answer only outside production */}}
          {{- range $path := list "/.well-known" "/health" "/docs" "/redoc" "/openapi.json" }}
          - path: {{ $path }}
            pathType: Prefix
            backend:
              service:
                name: {{ include "guardnous.fullname" $ }}-api
                port:
                  number: {{ $.Values.api.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "guardnous.fullname" . }}-web
                port:
                  number: {{ .Values.web.port }}
{{- end }}
