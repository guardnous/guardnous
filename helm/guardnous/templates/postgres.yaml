{{/* Bundled PostgreSQL — only for dev/testing. Disable in production. */}}
{{- if .Values.database.bundled.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "guardnous.fullname" . }}-postgres
  labels:
    {{- include "guardnous.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "guardnous.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "guardnous.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        {{- include "guardnous.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: postgres
    spec:
      containers:
        - name: postgres
          image: {{ .Values.database.bundled.image }}
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: guardnous
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "guardnous.secretName" . }}
                  key: DATABASE_PASSWORD
            - name: POSTGRES_DB
              value: guardnous
            # A sub-directory, so a volume that contains lost+found can be used
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "guardnous"]
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "guardnous"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.database.bundled.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.database.bundled.storageClass }}
        storageClassName: {{ .Values.database.bundled.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.database.bundled.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "guardnous.fullname" . }}-postgres
  labels:
    {{- include "guardnous.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    {{- include "guardnous.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
{{- end }}
