name: Docker Publish

on:
  release:
    types: [published]
  push:
    tags: ["v*"]

# Publishes ghcr.io/<owner>/<repository>/backend and .../frontend.
# The Helm chart defaults to the repositories guardnous/api and guardnous/web;
# to deploy these images set, in your values:
#   api.image.repository, worker.image.repository, beat.image.repository: ghcr.io/<owner>/<repository>/backend
#   web.image.repository: ghcr.io/<owner>/<repository>/frontend
#
# The frontend image has the address of the API compiled in. Set the repository
# variable NEXT_PUBLIC_API_URL (Settings → Secrets and variables → Actions →
# Variables) to the public address of your installation; without it the image
# calls http://localhost:7002 and only suits a local docker compose setup.
env:
  REGISTRY: ghcr.io

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: ./backend
            image_name: backend
          - context: ./frontend
            image_name: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.image_name }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Used by the frontend Dockerfile only; the backend build ignores it
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:7002' }}
          cache-from: type=gha,scope=${{ matrix.image_name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}
