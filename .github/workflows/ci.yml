name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      # Same command as `make lint`; run from backend/ so the rules in
      # backend/pyproject.toml ([tool.ruff]) apply.
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests alembic

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: guardnous_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      # backend/tests/conftest.py replaces the two database URLs with SQLite;
      # the PostgreSQL service above is not used by the current tests.
      DATABASE_URL: "postgresql+asyncpg://test:test@localhost:5432/guardnous_test"
      DATABASE_URL_SYNC: "postgresql+psycopg2://test:test@localhost:5432/guardnous_test"
      REDIS_URL: "redis://localhost:6379/0"
      CELERY_BROKER_URL: "redis://localhost:6379/1"
      CELERY_RESULT_BACKEND: "redis://localhost:6379/2"
      SECRET_KEY: "ci-test-secret-key-not-for-production"
      # Throwaway Fernet key for the test database only
      ENCRYPTION_KEY: "Y2ktdGVzdC1mZXJuZXQta2V5LW5vdC1mb3ItcHJvZC0="
      RATE_LIMIT_ENABLED: "false"
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/poetry.lock
            backend/requirements-cloud.txt
      - name: Install Poetry
        run: pip install poetry==1.8.2
      - name: Install dependencies
        working-directory: backend
        run: |
          poetry config virtualenvs.create false
          poetry install --no-interaction --no-root
      # boto3/botocore, azure-* and google-* are not Poetry dependencies; the
      # backend image installs them from this file and several tests need them.
      - name: Install cloud SDKs
        working-directory: backend
        run: pip install -r requirements-cloud.txt
      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit safety
      - name: Run Bandit (SAST)
        # The full report (all severities) is uploaded below. The job fails only
        # on high-severity findings; lower ones are reviewed from the report.
        run: |
          bandit -r backend/app/ -f json -o bandit-report.json --exit-zero
          bandit -r backend/app/ --severity-level high
      - name: Upload Bandit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: bandit-report.json

  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Security audit (npm)
        run: npm audit --audit-level=moderate || true
      - run: npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
