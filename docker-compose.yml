# Settings: the api, celery-worker and celery-beat services receive every line
# of .env (env_file). The entries listed under `environment:` take precedence
# over .env, which is how the database, Redis and Celery addresses always point
# at the postgres/redis services here, whatever .env says about localhost.
# Requires Docker Compose v2.24 or newer (env_file with `required: false`).

x-backend-env-file: &backend-env-file
  - path: .env
    required: false

x-backend-addresses: &backend-addresses
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-guardnous}:${POSTGRES_PASSWORD:-guardnous}@postgres:5432/${POSTGRES_DB:-guardnous}
  DATABASE_URL_SYNC: postgresql+psycopg2://${POSTGRES_USER:-guardnous}:${POSTGRES_PASSWORD:-guardnous}@postgres:5432/${POSTGRES_DB:-guardnous}
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-guardnous}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-guardnous}
      POSTGRES_DB: ${POSTGRES_DB:-guardnous}
    ports:
      - "7000:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "7001:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 200mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "7002:8000"
    env_file: *backend-env-file
    environment:
      <<: *backend-addresses
      DEBUG: "${DEBUG:-false}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}"
      WEBHOOK_SECRET: "${WEBHOOK_SECRET:-}"
      CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:7003","http://localhost:7002"]}'
      CORS_ALLOW_ALL: "${CORS_ALLOW_ALL:-false}"
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:7003}
      BACKEND_URL: ${BACKEND_URL:-http://localhost:7002}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      AWS_ONBOARDING_TEMPLATE_URL: ${AWS_ONBOARDING_TEMPLATE_URL:-}
      # GitHub App (pull requests come from the app's bot, not a person)
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-guardnous}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:-}
      # AI / Agentic layer (defaults to offline mock; set LLM_PROVIDER + LLM_API_KEY to go live)
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_AUTO_TRIAGE_AFTER_SCAN: ${AGENT_AUTO_TRIAGE_AFTER_SCAN:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_VERSION: ${LLM_API_VERSION:-2024-06-01}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./AGENTS.md:/app/AGENTS.md:ro
      - ./SKILLS.md:/app/SKILLS.md:ro
      - ./PROMPTS.md:/app/PROMPTS.md:ro
      # Shared with the worker so a scanner binary approved in the UI applies to scans
      - plugin_cache:/app/data/plugin_cache
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=2
    env_file: *backend-env-file
    environment:
      <<: *backend-addresses
      DEBUG: "${DEBUG:-false}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}"
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:-guardnous}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:-}
      AGENT_ENABLED: ${AGENT_ENABLED:-true}
      AGENT_AUTO_TRIAGE_AFTER_SCAN: ${AGENT_AUTO_TRIAGE_AFTER_SCAN:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_VERSION: ${LLM_API_VERSION:-2024-06-01}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Agent runs execute in the worker and read the same three documents as the api
      - ./AGENTS.md:/app/AGENTS.md:ro
      - ./SKILLS.md:/app/SKILLS.md:ro
      - ./PROMPTS.md:/app/PROMPTS.md:ro
      - plugin_cache:/app/data/plugin_cache
    healthcheck:
      test: ["CMD", "celery", "-A", "app.tasks.celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: *backend-env-file
    environment:
      <<: *backend-addresses
      DEBUG: "${DEBUG:-false}"
      ENVIRONMENT: "${ENVIRONMENT:-development}"
      SECRET_KEY: "${SECRET_KEY:?Set SECRET_KEY in .env}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.tasks.celery_app inspect ping --timeout 5 2>/dev/null | grep -q OK"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${BACKEND_URL:-http://localhost:7002}
    restart: unless-stopped
    ports:
      - "7003:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  postgres_data:
  redis_data:
  plugin_cache:
